name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # The fixed debug key that was written out here was public, and is retired (the owner's word, 28 Nov 2026).
      # This branch holds the old FM1 Burger 1.0 line, which only that key could update: its build stops here rather
      # than publish an APK on another key. Burger Studio Lab is built from the work branch, on the Maker Hip key.
      - name: The old key is retired
        run: |
          echo "The old signing key is retired: FM1 Burger 1.0 (this branch) is not built any more. See the work branch."
          exit 1

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: burgerstudio-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to the Releases page
        # only builds of main replace the "latest" release; test builds of other branches stay as artifacts
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/outputs/apk/debug/burgerstudio-debug.apk \
            --title "Burger Studio - latest build" \
            --notes "Debug APK built from the latest commit. Download the .apk file below and install it." \
            --target "${{ github.sha }}"
