name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # 3.66: the Maker Hip release key, from this repository's Secrets (never in the repository). No key: no build
      # (an APK on another key would not install over the last one). The old fixed debug key is no longer here.
      - name: The Maker Hip release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_B64_2: ${{ secrets.RELEASE_KEYSTORE_B64_2 }}
          RELEASE_KEYSTORE_B64_3: ${{ secrets.RELEASE_KEYSTORE_B64_3 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_B64" ]; then echo "The Maker Hip key is not in Secrets: stop"; exit 1; fi
          printf '%s%s%s' "$RELEASE_KEYSTORE_B64" "$RELEASE_KEYSTORE_B64_2" "$RELEASE_KEYSTORE_B64_3" | tr -d ' \t\r\n' | base64 -d > release.jks

      - name: Read the app version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        env:
          RELEASE_PASSWORD: ${{ secrets.RELEASE_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace
          # (signed with the Maker Hip key, or no APK)
          SIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs build/outputs/apk/debug/*.apk | grep -i "SHA-256 digest"
          "$SIGNER" verify --print-certs build/outputs/apk/debug/*.apk | grep -qi "SHA-256 digest: f3d4074b5e5a731072b992434b0985f8c376dbf4b76fa75eb6445fbeafea4490" || \
            { echo "The APK is not signed with the Maker Hip key: stop"; exit 1; }

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: burgerstudio-v${{ steps.ver.outputs.name }}-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The "v1.0" release must hold the original FM1 Burger (commit 5831bd6, the last build before the redesign).
      # If it is missing or holds something else, rebuild that commit with the same signing key and put it there.
      - name: Keep the original FM1 Burger 1.0 as its own release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: 5831bd6c0bb8a268902b62461367a6196858a296
        run: |
          if gh release view v1.0 --json assets -q '.assets[].name' 2>/dev/null | grep -qx 'fm1burger-debug.apk'; then
            echo "v1.0 already holds the original FM1 Burger"
            exit 0
          fi
          git fetch --depth 1 origin "$OLD"
          git worktree add old FETCH_HEAD
          if [ ! -f debug.keystore ]; then echo "(3.66: the old fixed key is no longer in CI: FM1 Burger 1.0 is not rebuilt)"; exit 0; fi
          cp debug.keystore old/
          (cd old && gradle assembleDebug --stacktrace)
          gh release delete v1.0 --yes --cleanup-tag || true
          gh release create v1.0 old/build/outputs/apk/debug/fm1burger-debug.apk \
            --title "FM1 Burger 1.0" \
            --notes "The original FM1 Burger (built from commit $OLD), before the redesign. Kept so you can always go back to it." \
            --target main

      # Every version gets its own release page (v2.0, v2.1, ...); builds of a work branch are marked pre-release
      - name: Publish this version
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.name }}
        run: |
          PRE=""
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then PRE="--prerelease"; fi
          gh release delete "v$VER" --yes --cleanup-tag || true
          gh release create "v$VER" build/outputs/apk/debug/*.apk $PRE \
            --title "$(case "$VER" in *lab*) echo "Burger Studio Lab ${VER%-lab}";; *) echo "Burger Studio $VER";; esac)" \
            --notes "Burger Studio $VER. Each app line installs on its own: FM1 Burger (1.x), Burger Studio (2.x) and Burger Studio Lab (3.x, experimental) can all be on one device." \
            --target "${{ github.sha }}"

      - name: Publish APK to the Releases page
        # only builds of main replace the "latest" release; test builds of other branches stay as artifacts
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/outputs/apk/debug/*.apk \
            --title "Burger Studio - latest build" \
            --notes "Debug APK built from the latest commit. Download the .apk file below and install it." \
            --target "${{ github.sha }}"
